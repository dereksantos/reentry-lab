<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Reentry Lab">
  <!-- Small-size version of logo.svg (favicons, 16–48 px): bigger planet, thicker arc, larger vehicle, no faint halo. -->
  <defs>
    <linearGradient id="rls-arc" x1="4" y1="14" x2="50" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb35c" stop-opacity=".2"/><stop offset=".45" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ff5a2a"/>
    </linearGradient>
    <clipPath id="rls-frame"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#rls-frame)">
    <rect width="64" height="64" fill="#0b1e33"/>
    <circle cx="28" cy="38" r="19" fill="#16426b" stroke="#5ea2ff" stroke-width="3"/>
    <path d="M3 17 C18 7 39 9 49 30" fill="none" stroke="url(#rls-arc)" stroke-width="6.5" stroke-linecap="round"/>
    <circle cx="50" cy="32" r="8" fill="#ff8a3d" fill-opacity=".35"/>
    <circle cx="50" cy="32" r="5" fill="#fff1e0"/>
  </g>
</svg>
