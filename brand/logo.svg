<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Reentry Lab">
  <!-- Reentry Lab mark: a capsule, heat shield leading, at the end of its glowing entry trail above the planet's limb. -->
  <defs>
    <linearGradient id="rl-trail" x1="3" y1="6" x2="38" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0"/><stop offset=".6" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ff5a2a"/>
    </linearGradient>
    <clipPath id="rl-frame"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#rl-frame)">
    <rect width="64" height="64" fill="#0b1e33"/>
    <circle cx="54" cy="98" r="54" fill="#123a5e"/>
    <circle cx="54" cy="98" r="57.5" fill="none" stroke="#5ea2ff" stroke-opacity=".4" stroke-width="3"/>
    <path d="M2 8 Q24 12 35 33" fill="none" stroke="url(#rl-trail)" stroke-width="5.5" stroke-linecap="round"/>
    <g transform="translate(38 38) rotate(58) scale(.42)">
      <path d="M17 -22 Q26 0 17 22" fill="none" stroke="#ffd27a" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M9 -15 L-11 -6 L-11 6 L9 15 Z" fill="#e4ebf3"/>
      <path d="M9 -15 Q14 0 9 15" fill="none" stroke="#ff5a2a" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
</svg>
