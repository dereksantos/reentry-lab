<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reentry Lab</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#06090e">
</head>
<body>
  <div id="app">
    <div class="viewport" id="viewport">
      <canvas id="scene"></canvas>
      <div id="labels" class="labels"></div>
    </div>

    <header class="topbar glass">
      <div class="brand">
        <img class="brand-mark" src="/mark.svg" width="28" height="26" alt="">
        <span class="brand-name">Reentry Lab</span>
        <span class="brand-sub">entry simulator</span>
      </div>
      <button class="preset-btn" id="presetBtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="hangar" title="Choose a mission">
        <span class="pthumb"><img alt="" width="54" height="34"></span>
        <span class="ptext"><b>Loading…</b><span class="psub"></span></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="checks" id="checks" aria-live="polite"></div>
      <div class="top-actions">
        <span class="computing" id="computing" hidden>Computing…</span>
        <button class="btn" id="pinBtn" type="button" title="Overlay this run for comparison">Pin run</button>
        <button class="btn primary" id="saveRunBtn" type="button" title="Save this run to the notebook">Save run</button>
        <a class="btn ghost support" id="supportLink" target="_blank" rel="noopener noreferrer" hidden>♥ Support</a>
        <button class="btn ghost" id="settingsBtn" type="button" hidden>Sign in</button>
        <span class="divider" aria-hidden="true"></span>
        <button class="ibtn" id="focusBtn" type="button" aria-pressed="false" aria-label="Focus view: hide the panels" title="Focus view (F)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
      </div>
    </header>

    <div class="hangar glass" id="hangar" role="dialog" aria-label="Choose a mission" hidden></div>

    <aside class="left" id="paramPanel" aria-label="Simulation settings"></aside>

    <div class="hud glass" id="hud"></div>

    <div class="view-tools glass" role="toolbar" aria-label="Camera">
      <button class="ibtn" type="button" data-cam="orbit" aria-pressed="true" aria-label="Free camera" title="Free camera">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M3.5 9h17M3.5 15h17"/></svg>
      </button>
      <button class="ibtn" type="button" data-cam="follow" aria-pressed="false" aria-label="Follow the vehicle" title="Follow the vehicle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
      <button class="ibtn" type="button" data-cam="fit" aria-label="Fit the whole path" title="Fit the whole path">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19c5-1 7-6 9-10s4-5 7-5M4 19h.01M20 4h.01"/></svg>
      </button>
      <span class="sep" aria-hidden="true"></span>
      <button class="ibtn" type="button" id="exagDown" aria-label="Less altitude exaggeration" title="Altitude exaggeration down">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
      </button>
      <span class="exag" title="Altitude exaggeration"><span>ALT</span><b>×<span id="exagOut">8</span></b></span>
      <button class="ibtn" type="button" id="exagUp" aria-label="More altitude exaggeration" title="Altitude exaggeration up">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>

    <div class="legend glass" id="legend"></div>
    <div class="inset-frame" id="insetFrame"><span class="inset-label">Vehicle camera</span>
      <button class="ride-btn" id="rideBtn" type="button" title="See the descent from the vehicle window, with sound">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M8 12a4 4 0 1 0 8 0a4 4 0 1 0-8 0"/></svg>Ride along
      </button>
    </div>

    <section class="bottom glass" aria-label="Playback and plots">
      <div class="timeline" id="timeline"></div>
      <div class="charts" id="charts"></div>
    </section>

    <nav class="mtabs glass" id="mtabs" aria-label="Panels">
      <button type="button" data-sheet="plots" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M6 16l4-6 3 3 5-8"/></svg>Plots</button>
      <button type="button" data-sheet="settings" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8M14 4v6M8 14v6"/></svg>Settings</button>
      <button type="button" data-sheet="research" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>Research</button>
      <button type="button" id="mRideBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M8 12a4 4 0 1 0 8 0a4 4 0 1 0-8 0"/></svg>Ride along</button>
    </nav>

    <aside class="right glass" id="researchPanel" aria-label="Research">
      <nav class="tabs" role="tablist">
        <button role="tab" type="button" id="tab-agent" aria-selected="true" data-tab="agent">Research</button>
        <button role="tab" type="button" id="tab-runs" aria-selected="false" data-tab="runs">Runs</button>
        <button role="tab" type="button" id="tab-notebook" aria-selected="false" data-tab="notebook">Notebook</button>
      </nav>
      <section class="tabpanel" id="panel-agent" data-panel="agent"></section>
      <section class="tabpanel" id="panel-runs" data-panel="runs" hidden></section>
      <section class="tabpanel" id="panel-notebook" data-panel="notebook" hidden></section>
    </aside>
    <button class="edge-tab glass" id="leftTab" type="button" data-panel="left" aria-controls="paramPanel" aria-expanded="true" title="Hide settings ([)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 7l-5 5 5 5"/></svg><span class="sr">Settings panel</span>
    </button>
    <button class="edge-tab glass" id="rightTab" type="button" data-panel="right" aria-controls="researchPanel" aria-expanded="true" title="Hide research (])">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 7l5 5-5 5"/></svg><span class="sr">Research panel</span>
    </button>
    <button class="edge-tab glass" id="bottomTab" type="button" data-panel="bottom" aria-controls="charts" aria-expanded="true" title="Hide plots">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg><span class="sr">Plots</span>
    </button>
  </div>
  <div class="ride" id="ride" role="dialog" aria-modal="true" aria-label="Ride along" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
