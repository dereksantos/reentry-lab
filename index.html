<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reentry Lab</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230b1e33'/%3E%3Cpath d='M6 9 Q18 12 24 24' stroke='%23ff8a3d' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-name">Reentry Lab</span>
        <span class="brand-sub">entry simulator</span>
      </div>
      <label class="preset-pick">
        <span class="sr">Preset</span>
        <select id="presetSelect" aria-label="Preset"></select>
      </label>
      <div class="checks" id="checks" aria-live="polite"></div>
      <div class="top-actions">
        <span class="computing" id="computing" hidden>Computing…</span>
        <button class="btn" id="pinBtn" type="button" title="Overlay this run for comparison">Pin run</button>
        <button class="btn" id="saveRunBtn" type="button" title="Save this run to the notebook">Save run</button>
        <a class="btn ghost support" id="supportLink" target="_blank" rel="noopener noreferrer" hidden>♥ Support</a>
        <button class="btn ghost" id="settingsBtn" type="button" hidden>Sign in</button>
      </div>
    </header>

    <aside class="left" id="paramPanel" aria-label="Simulation settings"></aside>

    <main class="stage">
      <div class="viewport" id="viewport">
        <canvas id="scene"></canvas>
        <div id="labels" class="labels"></div>
        <div class="hud" id="hud"></div>
        <div class="view-tools">
          <div class="seg" role="group" aria-label="Camera">
            <button type="button" data-cam="orbit" aria-pressed="true">Free</button>
            <button type="button" data-cam="follow" aria-pressed="false">Follow</button>
            <button type="button" data-cam="fit">Fit path</button>
          </div>
          <label class="exag">
            <span>Altitude ×<b id="exagOut">8</b></span>
            <input type="range" id="exag" min="1" max="40" step="1" value="8">
          </label>
        </div>
        <div class="legend" id="legend"></div>
        <div class="inset-frame" id="insetFrame"><span class="inset-label">Vehicle camera</span></div>
      </div>
      <section class="bottom">
        <div class="timeline" id="timeline"></div>
        <div class="charts" id="charts"></div>
      </section>
    </main>

    <aside class="right" aria-label="Research">
      <nav class="tabs" role="tablist">
        <button role="tab" type="button" id="tab-agent" aria-selected="true" data-tab="agent">Research</button>
        <button role="tab" type="button" id="tab-runs" aria-selected="false" data-tab="runs">Runs</button>
        <button role="tab" type="button" id="tab-notebook" aria-selected="false" data-tab="notebook">Notebook</button>
      </nav>
      <section class="tabpanel" id="panel-agent" data-panel="agent"></section>
      <section class="tabpanel" id="panel-runs" data-panel="runs" hidden></section>
      <section class="tabpanel" id="panel-notebook" data-panel="notebook" hidden></section>
    </aside>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
