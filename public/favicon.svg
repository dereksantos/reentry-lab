    <circle cx="56" cy="102" r="56" fill="#16426b"/>
    <path d="M-2 6 Q20 9 30 28" fill="none" stroke="url(#rls-trail)" stroke-width="9" stroke-linecap="round"/>
    <g transform="translate(36 37) rotate(58) scale(.68)">
      <path d="M18 -22 Q27 0 18 22" fill="none" stroke="#ffd27a" stroke-width="5" stroke-linecap="round"/>
      <path d="M9 -15 L-11 -6 L-11 6 L9 15 Z" fill="#e4ebf3"/>
