<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Reentry Lab">
  <!-- Small-size version of logo.svg (favicons, 16–48 px): thicker trail, larger capsule, no faint details. -->
  <defs>
    <linearGradient id="rls-trail" x1="0" y1="4" x2="32" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb35c" stop-opacity=".15"/><stop offset=".55" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ff5a2a"/>
    </linearGradient>
    <clipPath id="rls-frame"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#rls-frame)">
